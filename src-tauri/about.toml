# cargo-about settings for THIRD-PARTY-NOTICES.txt. Regenerate after changing dependencies:
#   cd src-tauri && cargo about generate about.hbs -o ../THIRD-PARTY-NOTICES.txt
# The order matters: for a crate offered under a choice of licences, the first one listed
# here that it offers is the one quoted.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
# The platforms the app is built for (see .github/workflows/main.yml).
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
# The app itself is covered by LICENSE, not listed here.
private = { ignore = true }

# exr keeps its licence, with both copyright notices, in LICENSE.md, which cargo-about
# doesn't find on its own. Update the checksum if exr is upgraded.
[exr.clarify]
license = "BSD-3-Clause"
[[exr.clarify.files]]
path = "LICENSE.md"
license = "BSD-3-Clause"
checksum = "97e4d3aa7a9e8ac31979c16ca8bb2b628a9cb72c3362185ad2bf4ad77f43551f"

[package]
name = "radial-menu-builder"
version = "0.1.0"
description = "A Tauri 2 App for building radial menus"
edition = "2021"
rust-version = "1.70"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

# Tauri 2 (stable 2.x line)
tauri = { version = "2", features = ["tray-icon"] }

# Plugins you use
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "=2.5.0"
tauri-plugin-single-instance = "=2.3.2"

# Matcaps tab: PNG/JPG/EXR reading and writing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "hdr"] }
exr = "1.74"
base64 = "0.22"
trash = "5"

# Fonts tab: reading TTF and OTF fonts
ttf-parser = "0.25"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Decoding big matcaps is slow in an unoptimised build, so optimise the image crates
# even in `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.exr]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-inflate]
opt-level = 3

[features]
default = []

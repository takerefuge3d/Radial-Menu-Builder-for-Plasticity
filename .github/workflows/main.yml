name: 'Build and Release'
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    
jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app for Apple Silicon and Intel Macs (checked on an Intel Mac by mac-intel-test.yml)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust-target: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
            rust-target: ''
          # Linux: a .deb, built on Ubuntu 22.04 (what Plasticity supports); the AppImage is made
          # in its own step below
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'
            rust-target: ''
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev desktop-file-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
          
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Radial Menu Builder++ for Plasticity v__VERSION__'
          releaseBody: |
            Download and install this version.

            Radial Menu Builder++ for Plasticity is the new name for Plasticity Radial Menu Builder. On Windows the installer replaces the old version,
            and your themes, matcap collections and settings are kept. On a Mac, drag the new app into
            Applications, then you can delete "Plasticity Radial Menu Builder" from Applications.
            
            **macOS Users**: The DMG is universal: the same app runs on Apple Silicon and Intel Macs.
            I test on Apple Silicon. The Intel version passed automated tests on an Intel Mac, but I haven't
            been able to try it on a real Intel Mac myself, so please let me know if anything doesn't work.

            The app isn't notarized by Apple, so the first launch is blocked once.
            Open it, click "Done" on the warning, then go to System Settings > Privacy & Security,
            scroll down and click "Open Anyway". After that it opens normally.

            **Linux Users**: There's a .deb for Ubuntu, Debian and Mint, and an AppImage for other distributions
            such as Fedora and Arch (make it executable, then run it). It's built on Ubuntu 22.04, the version
            Plasticity supports, and passed automated tests there and on Ubuntu 24.04, Debian 12, Fedora and
            Arch, but I haven't been able to try it on Linux myself, so please let me know if anything doesn't
            work. On GNOME, the tray icon needs the AppIndicator extension, which Ubuntu has turned on.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The AppImage is built here rather than by tauri-action, so it can be repacked without the
      # Wayland client libraries it would bring from Ubuntu 22.04: they stop the newer graphics
      # drivers on Fedora and Arch from starting, which leaves a blank window (see linux-test.yml).
      # Every desktop has its own copies. Then it's added to the same draft release.
      - name: Build the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tauri build --bundles appimage
          A=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
          (cd "$RUNNER_TEMP" && "$A" --appimage-extract > /dev/null)
          find "$RUNNER_TEMP/squashfs-root" \( -name 'libwayland-client.so*' -o -name 'libwayland-cursor.so*' -o -name 'libwayland-egl.so*' \) -print -delete
          OUT="$RUNNER_TEMP/$(basename "$A" | tr ' ' '.')"
          repack() { # $1: where to get appimagetool
            curl -fsSLo "$RUNNER_TEMP/appimagetool" "$1" || return 1
            chmod +x "$RUNNER_TEMP/appimagetool"
            ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run "$RUNNER_TEMP/squashfs-root" "$OUT"
          }
          repack https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage ||
            repack https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          gh release upload "${{ github.ref_name }}" "$OUT" --clobber
          
      - name: Create macOS installation guide
        if: matrix.platform == 'macos-latest'
        run: |
          cat > INSTALL-MACOS.md << 'EOF'
          # macOS Installation Guide
          
          This app is unsigned but safe to use. Follow these steps:
          
          ## Installation Steps
          1. Download the `.dmg` file from the release
          2. Double-click to mount the DMG
          3. Drag the app to your Applications folder
          4. **Important**: Don't double-click to open the app yet
          
          ## First Launch
          1. Open "Radial Menu Builder++ for Plasticity" from Applications
          2. macOS says it can't verify the developer. Click "Done"
          3. Open System Settings > Privacy & Security
          4. Scroll down to the message about the app and click "Open Anyway"
          5. Confirm with your password. From then on it opens normally
          
          (On macOS 14 and earlier you can instead right-click the app, choose "Open", then "Open".)
          
          ## File Access Permissions
          macOS may ask for permission the first time you save into a protected folder
          such as Documents or Desktop. Click "Allow".
          
          ## Terminal Fix (last resort)
          Only if macOS says the app "is damaged" and there is no "Open Anyway" button:
          ```bash
          sudo xattr -r -d com.apple.quarantine "/Applications/Radial Menu Builder++ for Plasticity.app"
          ```
          
          ## What This App Does
          - Creates radial menus for design software
          - Saves/loads menu configurations as JSON files
          - Requires file access to function properly
          EOF
          
      - name: Upload installation guide
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installation-guide
          path: INSTALL-MACOS.md
